services:
  # ----------------------------------------------------------
  # Фронтенд (React + Vite, статика через nginx)
  # nginx проксирует /api на backend, поэтому в браузере адрес API относительный.
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ----------------------------------------------------------
  # Бэкенд (FastAPI). Наружу не открыт: доступ только через nginx.
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    environment:
      - APP_NAME=Area API
      - APP_VERSION=0.1.0
      - DEBUG=${DEBUG:-false}
    volumes:
      - project-data:/app/data
    restart: unless-stopped

volumes:
  project-data:
